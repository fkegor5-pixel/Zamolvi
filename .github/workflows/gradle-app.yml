name: Gradle app
on:
  push:
    branches: [gradle-app]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as this release tag (empty — build only)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: "true"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > signing/release.p12
          else echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: debug signature"; fi
      - name: Build
        env:
          ZAMOLVI_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
          ZAMOLVI_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'zamolvi' }}
        run: |
          set -o pipefail
          if ! gradle -p android :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
            grep -E "error:|FAILURE|What went wrong|ERROR:" -A2 build.log | head -c 60000 | python3 -c "import sys; print('::error title=gradle::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
            exit 1
          fi
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk "Zamolvi-${{ inputs.release || 'test' }}.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs Zamolvi-*.apk | head -3 | sed 's/^/::notice title=signature::/'
      - name: Publish
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          notes="docs/release-notes/$TAG.md"; [ -f "$notes" ] || notes=CHANGELOG.md
          flag=""; [ "${{ inputs.prerelease }}" = "true" ] && flag="--prerelease"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Zamolvi ${TAG#v}" --notes-file "$notes" $flag
          gh release upload "$TAG" Zamolvi-*.apk --clobber
