name: Gradle app
on:
  push:
    branches: [gradle-app]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as this release tag (empty — build only)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: "true"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > signing/release.p12
          else echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: debug signature"; fi
      - name: Build
        env:
          ZAMOLVI_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
          ZAMOLVI_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'zamolvi' }}
        run: |
          set -o pipefail
          if ! gradle -p android :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
            grep -E "error:|FAILURE|What went wrong|ERROR:" -A2 build.log | head -c 60000 | python3 -c "import sys; print('::error title=gradle::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
            exit 1
          fi
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk "Zamolvi-${{ inputs.release || 'test' }}.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs Zamolvi-*.apk | head -3 | sed 's/^/::notice title=signature::/'
      - name: Keep the APK for the smoke test
        uses: actions/upload-artifact@v4
        with: {name: apk, path: "Zamolvi-*.apk"}
      - name: Publish
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          notes="docs/release-notes/$TAG.md"; [ -f "$notes" ] || notes=CHANGELOG.md
          flag=""; [ "${{ inputs.prerelease }}" = "true" ] && flag="--prerelease"
          if gh release view "$TAG" > /dev/null 2>&1; then gh release edit "$TAG" --notes-file "$notes"; else gh release create "$TAG" --target "$GITHUB_SHA" --title "Zamolvi ${TAG#v}" --notes-file "$notes" $flag; fi
          gh release upload "$TAG" Zamolvi-*.apk --clobber

  smoke:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {name: apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 build-tools/smoke.py $(ls Zamolvi-*.apk) shots
      - name: Report
        if: always()
        run: |
          [ -f shots/crashes.txt ] && [ -s shots/crashes.txt ] && echo "::error title=crash::$(head -c 20000 shots/crashes.txt | sed 's/%/%25/g' | tr '\n' '|')"
          [ -f shots/summary.txt ] && echo "::notice title=smoke::$(cat shots/summary.txt | tr '\n' '|')"
          git config user.name "zamolvi-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin ci-shots && git checkout -q -B ci-shots origin/ci-shots || git checkout -q --orphan ci-shots
          git rm -rq --cached . > /dev/null 2>&1 || true
          dest="runs/${GITHUB_SHA::8}"; mkdir -p "$dest"; cp -r shots/* "$dest/" 2>/dev/null || true
          git add runs && git commit -qm "Smoke ${GITHUB_SHA::8}" && git push -q origin ci-shots || true
