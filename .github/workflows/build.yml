name: Build APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the APK to this release tag (for example v3.0); empty — artifact only"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # attach the APK to the release of a tag

env:
  APKTOOL_TAG: v3.0.3

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Apktool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$APKTOOL_TAG" --repo iBotPeaches/Apktool --pattern 'apktool_*.jar' --output apktool.jar

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.p12
            echo "Using the signing key from repository secrets."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: the APK is signed with a temporary key."
          fi

      - name: Build
        env:
          ZAMOLVI_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
          ZAMOLVI_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'zamolvi' }}
        run: |
          set -o pipefail
          python3 build-tools/build_apk.py --sdk "$ANDROID_HOME" --apktool apktool.jar 2>&1 | tee build.log

      - name: Show the failure in the run summary
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          tail -n 80 build.log | python3 -c "import sys; print('::error title=build::' + sys.stdin.read().replace('%','%25').replace('\\r','').replace('\\n','%0A'))"

      - uses: actions/upload-artifact@v4
        with:
          name: Zamolvi-apk
          path: build/Zamolvi-*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          notes="docs/release-notes/$TAG.md"
          [ -f "$notes" ] || notes=CHANGELOG.md
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Zamolvi ${TAG#v}" --notes-file "$notes"
          gh release upload "$TAG" build/Zamolvi-*.apk --clobber
