name: Build APK
on:
  push:
    branches: [main, gazeclick]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download face model
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
      - name: Test and build
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GazeClick-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GazeClick.apk
          gh release create "build-${{ github.run_number }}" GazeClick.apk --title "GazeClick build ${{ github.run_number }}" --notes "Автосборка"
