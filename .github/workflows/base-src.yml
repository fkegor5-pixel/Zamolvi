name: Decompile base app (reference for the Gradle rewrite)
on:
  push:
    branches: [base-src]
permissions:
  contents: write
jobs:
  jadx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - name: Decompile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo skylot/jadx --pattern 'jadx-1*.zip' --output jadx.zip || { echo "::error title=dl::$(gh release view --repo skylot/jadx --json assets -q '.assets[].name' | tr '\n' ' ')"; exit 1; }
          unzip -q jadx.zip -d jadx
          ./jadx/bin/jadx -d decompiled base/base-app-2.7.apk > jadx.log 2>&1 || echo "::warning title=jadx::$(tail -n 15 jadx.log | tr '\n' '|')"
          ls decompiled decompiled/sources | tr '\n' ' ' | sed 's/^/::notice title=tree::/' 
          mkdir -p reference/base-2.7
          cp -r decompiled/sources/ru reference/base-2.7/ 2>/dev/null || true
          cp -r decompiled/resources/res reference/base-2.7/res
          cp decompiled/resources/AndroidManifest.xml reference/base-2.7/
          echo "::notice title=files::$(find reference -type f | wc -l) files, $(du -sh reference | cut -f1)"
      - name: Commit
        run: |
          git config user.name "zamolvi-bot"; git config user.email "actions@users.noreply.github.com"
          git add reference
          git commit -qm "Reference: decompiled base app 2.7 (app sources and resources only)" && git push
