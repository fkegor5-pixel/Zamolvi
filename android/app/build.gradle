// Zamolvi built from sources: the former base APK (base-src/, recovered from 2.7) plus source/.
plugins { id "com.android.application" }

def repo = rootProject.projectDir.parentFile
def generated = layout.buildDirectory.dir("zamolvi-generated").get().asFile
def keystore = System.getenv("ZAMOLVI_KEYSTORE") ?: "$repo/signing/release.p12"

android {
    namespace "ru.replyai.android"
    compileSdk 35
    defaultConfig {
        applicationId "ru.replyai.android"   // the same id and key as before: installs over older versions
        minSdk 28
        targetSdk 35
        versionCode 39
        versionName "4.0.1"
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        java.srcDirs = ["$repo/base-src", "$repo/source"]
        res.srcDirs = ["src/main/res", "$repo/build-tools/widget-res", "$repo/build-tools/icon-res", "$generated/res"]
        assets.srcDirs = ["$generated/assets"]
    }
    signingConfigs {
        release {
            if (file(keystore).exists()) {
                storeFile file(keystore)
                storeType "pkcs12"
                storePassword System.getenv("ZAMOLVI_KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("ZAMOLVI_KEY_ALIAS") ?: "zamolvi"
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig file(keystore).exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    androidResources { noCompress "mp4" }   // the intro video is played from a file descriptor
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "com.github.mwiede:jsch:0.2.20"
    implementation "com.yandex.android:mobileads:7.18.8"
}

// Server bundle, interface translations and the optional intro video, made by the same code as before.
tasks.register("zamolviGenerated", Exec) {
    commandLine "python3", "$repo/build-tools/gradle_generated.py", generated
}
preBuild.dependsOn "zamolviGenerated"
